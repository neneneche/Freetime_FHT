spring:
  application:
    name: freetime
  datasource:
    url: jdbc:h2:mem:freetime;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: 8080
  # Honor X-Forwarded-* from Cloudflare Tunnel so same-origin requests
  # are not misdetected as CORS (public https host vs internal http port).
  forward-headers-strategy: framework

jwt:
  secret: freetime-secret-key-that-is-long-enough-for-hs256-algorithm-minimum-256-bits
  expiration: 86400000

app:
  cors:
    # Origin patterns; override with APP_CORS_ALLOWED_ORIGINS if you want to lock this down.
    allowed-origins: "*"