spring:
  application:
    name: freetime
  datasource:
    url: jdbc:h2:mem:freetime;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: 8080

jwt:
  secret: freetime-secret-key-that-is-long-enough-for-hs256-algorithm-minimum-256-bits
  expiration: 86400000

app:
  cors:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080,null